name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'

# Read-only permissions for PR validation
permissions:
  contents: read
  pull-requests: read

env:
  SOLUTION_FILE: src/EasyAF.EntityDesigner.slnx
  CONFIGURATION: Release
  VSIX_PROJECT_DIR: src/Microsoft.VisualStudio.Data.Entity.Package

jobs:
  validate:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Run Tests
        run: dotnet test ${{ env.SOLUTION_FILE }} -c ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Verify VSIX Created
        shell: pwsh
        run: |
          $outDir = Join-Path "${{ env.VSIX_PROJECT_DIR }}" "bin\${{ env.CONFIGURATION }}"
          $vsix = Get-ChildItem -Path $outDir -Filter "*.vsix" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vsix) {
            Write-Error "No VSIX file found under $outDir - build may have failed"
            exit 1
          }
          Write-Host "✓ VSIX created successfully: $($vsix.Name)"
          Write-Host "  Size: $([math]::Round($vsix.Length / 1MB, 2)) MB"
